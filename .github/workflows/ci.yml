name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore BimmerStudio.slnx

      - name: Build
        run: dotnet build BimmerStudio.slnx --no-restore --configuration Release

      # Integration tests that need a real Ecu folder skip themselves when
      # BIMMERSTUDIO_ECU_PATH is unset. BMW data is never committed, so on CI
      # only the simulation-backed and unit tests run.
      - name: Test
        run: >
          dotnet test BimmerStudio.slnx --no-build --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: ./artifacts/test-results
          if-no-files-found: ignore

  verify-portable-interpreter:
    name: interpreter builds portable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Guards the fork retarget: the portable TFM must keep building on a
      # non-Windows host, independently of the app solution.
      - name: Build EdiabasLib for net10.0
        run: >
          dotnet build external/ediabaslib/EdiabasLib/EdiabasLib/EdiabasLib.csproj
          --framework net10.0 --configuration Release
